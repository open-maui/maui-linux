# OpenMaui Linux CI Pipeline
name: CI

on:
  push:
    branches: [main, final, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: linux-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal
        continue-on-error: true

      - name: Performance benchmarks (warn only)
        # Headless benchmark suite (tools/Benchmarks, docs/PERFORMANCE.md)
        # compared against docs/perf-baseline.json. Shared runners are noisy
        # and are not the baseline machine, so regressions are reported in the
        # log (--warn-only) and never fail CI; --no-gpu keeps a software GL
        # (llvmpipe) from standing in for the GPU variants.
        run: dotnet run --project tools/Benchmarks -c Release -- --baseline docs/perf-baseline.json --compare --warn-only --no-gpu
        continue-on-error: true

      - name: Pack OpenMaui.Hosting
        run: dotnet pack Hosting.Abstractions/OpenMaui.Hosting.csproj --configuration Release -o ./nupkg

      - name: Pack OpenMaui.Controls.Linux
        run: dotnet pack --configuration Release --no-build -o ./nupkg

      - name: Pack OpenMaui.Controls.Linux.MediaElement
        # No --no-build: the root `dotnet build` step only builds the main
        # OpenMaui.Controls.Linux project and its ProjectReferences. The
        # MediaElement sibling is an independent project, not in the root
        # build graph, so pack must build it itself.
        run: dotnet pack MediaElement/OpenMaui.Controls.Linux.MediaElement.csproj --configuration Release -o ./nupkg

      - name: Pack OpenMaui.Controls.Linux.Maps
        # Same independent-sibling reasoning as MediaElement; pack builds it.
        run: dotnet pack Maps/OpenMaui.Controls.Linux.Maps.csproj --configuration Release -o ./nupkg

      - name: Pack OpenMaui.Controls.Linux.Blazor
        # Independent sibling (BlazorWebView on WPE); built by this pack step.
        run: dotnet pack Blazor/OpenMaui.Controls.Linux.Blazor.csproj --configuration Release -o ./nupkg

      - name: Pack OpenMaui.Controls.Linux.Syncfusion
        # Independent sibling (bridge for Syncfusion's platform-neutral build);
        # built by this pack step.
        run: dotnet pack Syncfusion/OpenMaui.Controls.Linux.Syncfusion.csproj --configuration Release -o ./nupkg

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v3
        with:
          name: nuget-packages
          path: ./nupkg/*.nupkg

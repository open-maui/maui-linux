# OpenMaui Linux Release - Publish to Package Registries
name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-run against any ref (for example after adding a package to an
  # already-tagged version): Actions -> Release -> Run workflow, enter the version.
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (for example 10.0.101.2)'
        required: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Build and Publish
    runs-on: linux-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get version from tag or input
        id: version
        run: |
          if [ -n "${{ gitea.event.inputs.version }}" ]; then
            VERSION="${{ gitea.event.inputs.version }}"
          else
            TAG="${{ gitea.ref_name }}"
            VERSION="${TAG#v}"
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal
        continue-on-error: true

      - name: Pack OpenMaui.Hosting package
        run: dotnet pack Hosting.Abstractions/OpenMaui.Hosting.csproj --configuration Release -o ./nupkg -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Pack OpenMaui.Controls.Linux package
        run: dotnet pack --configuration Release --no-build -o ./nupkg -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Pack OpenMaui.Controls.Linux.MediaElement package
        # Opt-in sibling: depends on the main package + CommunityToolkit.Maui.MediaElement.
        # Shipped separately so consumers who don't need video playback don't pull in the
        # toolkit's ~140KB MediaElement DLL.
        #
        # No --no-build: the root `dotnet build` step builds only the main
        # OpenMaui.Controls.Linux project; MediaElement is an independent
        # sibling and must be built by this pack step.
        run: dotnet pack MediaElement/OpenMaui.Controls.Linux.MediaElement.csproj --configuration Release -o ./nupkg -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Pack OpenMaui.Controls.Linux.Maps package
        # Opt-in sibling for Microsoft.Maui.Controls.Maps — OSM raster tiles in
        # Skia, pin/polyline overlays, standalone SkiaMap view. Shipped separately
        # because Microsoft.Maui.Controls.Maps is itself a separate NuGet, so
        # consumers who don't render maps shouldn't pull in either dependency.
        # Same independent-sibling reasoning as MediaElement: must be built by
        # this pack step.
        run: dotnet pack Maps/OpenMaui.Controls.Linux.Maps.csproj --configuration Release -o ./nupkg -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Pack OpenMaui.Controls.Linux.Blazor package
        # Opt-in sibling for Microsoft.AspNetCore.Components.WebView.Maui
        # (BlazorWebView on the WPE WebKit view). Independent sibling like
        # MediaElement and Maps: built by this pack step, no --no-build.
        run: dotnet pack Blazor/OpenMaui.Controls.Linux.Blazor.csproj --configuration Release -o ./nupkg -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Pack Templates package
        run: dotnet pack templates/OpenMaui.Linux.Templates.csproj --configuration Release -o ./nupkg -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v3
        with:
          name: nuget-packages
          path: ./nupkg/*.nupkg

      - name: Publish to Gitea Packages
        # --skip-duplicate: re-running a release (for example after adding a
        # package) must not fail on versions that are already published.
        run: |
          for pkg in ./nupkg/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key ${{ secrets.GITEATOKEN }} \
              --source https://git.marketally.ai/api/packages/${{ gitea.repository_owner }}/nuget/index.json \
              --skip-duplicate
          done

      - name: Publish to NuGet.org
        if: ${{ secrets.NUGET_API_KEY != '' }}
        run: |
          for pkg in ./nupkg/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key ${{ secrets.NUGET_API_KEY }} \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
